<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>生き物判別 PWA</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      background: #121212;
      color: #fff;
      margin: 0;
      padding: 16px;
    }
    h2 { font-size: 1.2rem; margin-bottom: 12px; }

    /* 縦画面用スタイル */
    .camera-container { position: relative; width: 100%; max-width: 400px; margin: 0 auto 12px; }
    video, canvas { width: 100%; border-radius: 12px; background: #000; aspect-ratio: 3/4; object-fit: cover; }
    .btn-group { margin-bottom: 16px; }

    /* ボタン共通スタイル */
    button {
      font-size: 15px;
      font-weight: bold;
      padding: 12px 20px;
      border: none;
      border-radius: 25px;
      margin: 4px;
      cursor: pointer;
      transition: transform 0.1s, filter 0.1s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-record { background: #ff3b30; color: white; }
    .btn-stop { background: #ff9500; color: white; }
    button:active:not(:disabled), .search-btn:active {
      transform: scale(0.94);
      filter: brightness(0.75);
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    /* APIキー設定 */
    .api-key-box { max-width: 400px; margin: 0 auto 16px; background: #1c1c1e; padding: 10px; border-radius: 8px; font-size: 12px; }
    .api-key-box input { width: 70%; padding: 6px; border-radius: 4px; border: 1px solid #444; background: #2c2c2e; color: #fff; }

    /* ローディング表示 */
    #loading { display: none; margin: 20px 0; }
    .spinner { width: 36px; height: 36px; border: 4px solid rgba(255,255,255,0.1); border-top-color: #34c759; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 10px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* 解析結果カード */
    #result-section { display: none; max-width: 400px; margin: 0 auto; text-align: left; }
    .candidate-card { background: #1c1c1e; border-radius: 12px; padding: 14px; margin-bottom: 10px; border-left: 4px solid #34c759; }
    .candidate-title { font-size: 1.1rem; font-weight: bold; margin-bottom: 4px; color: #34c759; }
    .candidate-desc { font-size: 0.85rem; color: #ccc; margin-bottom: 10px; line-height: 1.4; }
    .search-btn {
      display: inline-block;
      background: #0a84ff;
      color: #fff;
      text-decoration: none;
      font-size: 13px;
      font-weight: bold;
      padding: 6px 12px;
      border-radius: 16px;
      transition: transform 0.1s, filter 0.1s;
      -webkit-tap-highlight-color: transparent;
    }

    /* iPhone横向き用レイアウト */
    @media (orientation: landscape) {
      body {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: flex-start;
        gap: 16px;
        padding: 10px;
      }
      h2 { width: 100%; margin-bottom: 4px; font-size: 1rem; }
      .camera-container { width: 45vw; max-width: none; margin: 0; }
      video, canvas { aspect-ratio: 4/3; height: auto; }
      .right-panel { width: 45vw; display: flex; flex-direction: column; align-items: center; }
      .api-key-box, .btn-group, #result-section { width: 100%; max-width: none; margin-bottom: 10px; }
      #loading { width: 100%; }
    }
  </style>
</head>
<body ontouchstart="">

  <h2>🌿 生き物（動物・昆虫・植物）判別</h2>

  <div class="camera-container">
    <video id="preview" autoplay playsinline muted></video>
    <canvas id="captureCanvas" style="display:none;"></canvas>
  </div>

  <div class="right-panel">
    <div class="api-key-box">
      <label>Gemini API Key: </label>
      <input type="password" id="apiKeyInput" placeholder="AI Studioのキーを入力">
    </div>

    <div class="btn-group">
      <button id="startBtn" class="btn-record">録画開始</button>
      <button id="stopBtn" class="btn-stop" disabled>停止＆判別</button>
    </div>

    <div id="loading">
      <div class="spinner"></div>
      <div>AIが生物を解析中...</div>
    </div>

    <div id="result-section">
      <h3 style="font-size: 1rem; margin-bottom: 8px;">🔍 判別結果候補</h3>
      <div id="candidates-container"></div>
    </div>
  </div>

  <script>
    let mediaRecorder;
    let recordedChunks = [];
    let captureInterval;
    let capturedFrames = [];

    const preview = document.getElementById('preview');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const loading = document.getElementById('loading');
    const resultSection = document.getElementById('result-section');
    const candidatesContainer = document.getElementById('candidates-container');
    const captureCanvas = document.getElementById('captureCanvas');
    const apiKeyInput = document.getElementById('apiKeyInput');

    // 保存されているAPIキーを復元
    apiKeyInput.value = localStorage.getItem('gemini_api_key') || '';
    apiKeyInput.onchange = () => localStorage.setItem('gemini_api_key', apiKeyInput.value.trim());

    // カメラの起動（iPhoneの外カメラ）
    async function initCamera() {
      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          throw new Error("お使いのブラウザはカメラ機能をサポートしていないか、HTTPS接続ではありません。");
        }

        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment" },
          audio: false
        });
        preview.srcObject = stream;

        let options = {};
        if (typeof MediaRecorder !== 'undefined' && MediaRecorder.isTypeSupported) {
          if (MediaRecorder.isTypeSupported('video/mp4')) {
            options = { mimeType: 'video/mp4' };
          } else if (MediaRecorder.isTypeSupported('video/webm')) {
            options = { mimeType: 'video/webm' };
          }
        }

        mediaRecorder = new MediaRecorder(stream, options);

        mediaRecorder.ondataavailable = (event) => {
          if (event.data.size > 0) recordedChunks.push(event.data);
        };

        mediaRecorder.onstop = async () => {
          clearInterval(captureInterval);
          loading.style.display = 'block';
          resultSection.style.display = 'none';

          const frameBase64 = capturedFrames[Math.floor(capturedFrames.length / 2)] || captureCurrentFrame();
          await analyzeImage(frameBase64);
        };

      } catch (err) {
        alert('カメラ起動エラー: ' + err.message + '\n\nSafariのカメラアクセス許可を確認してください。');
      }
    }

    // 静止画切り出し
    function captureCurrentFrame() {
      const context = captureCanvas.getContext('2d');
      captureCanvas.width = preview.videoWidth || 640;
      captureCanvas.height = preview.videoHeight || 480;
      context.drawImage(preview, 0, 0, captureCanvas.width, captureCanvas.height);
      return captureCanvas.toDataURL('image/jpeg', 0.8).split(',')[1];
    }

    // 録画開始ボタン
    startBtn.onclick = () => {
      if (!mediaRecorder) {
        alert('カメラが正しく初期化されていません。ページを再読み込みしてください。');
        return;
      }

      try {
        recordedChunks = [];
        capturedFrames = [];
        mediaRecorder.start();

        captureInterval = setInterval(() => {
          if (preview.readyState === 4) {
            capturedFrames.push(captureCurrentFrame());
          }
        }, 1000);

        startBtn.disabled = true;
        stopBtn.disabled = false;
        resultSection.style.display = 'none';
      } catch (err) {
        alert('録画開始エラー: ' + err.message);
      }
    };

    // 録画停止ボタン
    stopBtn.onclick = () => {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }
      startBtn.disabled = false;
      stopBtn.disabled = true;
    };

    // Gemini API解析
    async function analyzeImage(base64Image) {
      const apiKey = apiKeyInput.value.trim();
      
      if (!apiKey) {
        alert('Google Gemini API Keyを入力してください。');
        loading.style.display = 'none';
        return;
      }

      if (!base64Image) {
        alert('画像の切り出しに失敗しました。再度撮影してください。');
        loading.style.display = 'none';
        return;
      }

      const prompt = `この画像に写っている動物、昆虫、または植物を判別してください。
考えられる候補を可能性が高い順に最大3つまで挙げてください。
返答は必ず以下のJSON形式のみで出力してください（他の解説文は含めないでください）。

[
  {
    "name": "生物の名前（和名）",
    "confidence": "高/中/低",
    "description": "判別した特徴や根拠の簡潔な説明（50文字程度）"
  }
]`;

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [
                { text: prompt },
                { inlineData: { mimeType: "image/jpeg", data: base64Image } }
              ]
            }]
          })
        });

        const data = await response.json();

        if (data.error) {
          throw new Error(`APIエラー (${data.error.code}): ${data.error.message}`);
        }

        if (!data.candidates || data.candidates.length === 0) {
          throw new Error("AIからの回答が得られませんでした。");
        }

        const rawText = data.candidates[0].content.parts[0].text;
        const jsonMatch = rawText.match(/\[[\s\S]*\]/);
        if (!jsonMatch) throw new Error("JSONのパースに失敗しました");
        
        const candidates = JSON.parse(jsonMatch[0]);
        displayResults(candidates);

      } catch (err) {
        alert('解析エラーが発生しました: ' + err.message);
      } finally {
        loading.style.display = 'none';
      }
    }

    // 解析結果の表示
    function displayResults(candidates) {
      candidatesContainer.innerHTML = '';

      candidates.forEach(item => {
        const card = document.createElement('div');
        card.className = 'candidate-card';
        const googleSearchUrl = `https://www.google.com/search?tbm=isch&q=${encodeURIComponent(item.name)}`;

        card.innerHTML = `
          <div class="candidate-title">${item.name} <span style="font-size:11px; color:#aaa;">(${item.confidence})</span></div>
          <div class="candidate-desc">${item.description}</div>
          <a href="${googleSearchUrl}" target="_blank" rel="noopener" class="search-btn">
            🔍 Google画像検索で調べる
          </a>
        `;
        candidatesContainer.appendChild(card);
      });

      resultSection.style.display = 'block';
    }

    initCamera();
  </script>
</body>
</html>
